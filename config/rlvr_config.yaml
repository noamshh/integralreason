model:
  name: "models/sft/final/qwen3-4b-integral-merged"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 32
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-6
  num_epochs: 2
  num_generations: 8
  max_prompt_length: 256
  max_completion_length: 1024
  max_grad_norm: 1.0
  save_steps: 10
  warmup_steps: 8
  seed: 42
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.2

rewards:
  format_weight: 0.3
  correctness_weight: 0.7
  format_components:
    think_tags: 0.25
    final_answer_header: 0.25
    latex_boxed: 0.25
    sympy_boxed: 0.25
  correct_reward: 1.0
  incorrect_penalty: 0.0
  parse_partial_credit: 0.0

verification:
  numerical_tolerance: 1.0e-4
  verification_timeout: 5.0

logging:
  steps: 1
  report_to: "tensorboard"
  logging_dir: "logs/rlvr_tensorboard"
  save_total_limit: 3

paths:
  prompts_dataset: "data/rlvr/prompts.jsonl"
  output_dir: "models/rlvr/checkpoints/qwen3-4b-rlvr"
  final_model_dir: "models/rlvr/final/qwen3-4b-rlvr"

